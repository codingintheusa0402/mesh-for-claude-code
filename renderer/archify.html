<!doctype html>
<html><head><meta charset="utf-8"><title>Archify</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data:">
<style>
:root { --bg: #0b0d14; --panel: #12151f; --line: rgba(255,255,255,.09); --text: #e8ebf4; --dim: #8a93ad; --acc: #8fb8ff; --ok: #5be3a4; --warn: #e0a458; --bad: #ff6b6b; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; }
body { display: flex; flex-direction: column; }
header { display: flex; align-items: center; gap: 14px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); -webkit-app-region: drag; }
header .t { display: flex; flex-direction: column; min-width: 0; flex: 1; }
header .n { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
header .n .k { color: var(--dim); font-weight: 500; margin-right: 6px; }
header .m { color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill { display: inline-block; padding: 0 7px; border-radius: 9px; border: 1px solid var(--line); font-size: 11px; margin-left: 6px; }
.pill.warn { color: var(--warn); border-color: rgba(224,164,88,.45); } .pill.ok { color: var(--ok); border-color: rgba(91,227,164,.35); }
button { -webkit-app-region: no-drag; background: #1b2030; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font: inherit; cursor: pointer; white-space: nowrap; }
button:hover { border-color: rgba(143,184,255,.5); } button.pri { background: #2a3a66; border-color: rgba(143,184,255,.45); }
[hidden] { display: none !important; }
main { flex: 1; position: relative; min-height: 0; }
.card { position: absolute; inset: 0; display: grid; place-items: center; }
.card .box { width: min(560px, 90vw); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 26px 28px; }
.card h2 { margin: 0 0 6px; font-size: 17px; } .card p { margin: 6px 0; color: var(--dim); }
.step { margin-top: 16px; padding: 10px 12px; border-radius: 8px; background: #0e1119; font: 12px/1.4 ui-monospace, Menlo, monospace; color: #c9d2ea; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar { height: 3px; border-radius: 2px; background: #1b2030; overflow: hidden; margin-top: 14px; }
.bar i { display: block; height: 100%; width: 35%; background: linear-gradient(90deg, transparent, var(--acc), transparent); animation: run 1.6s linear infinite; }
@keyframes run { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
.err { color: var(--bad); }
.row { display: flex; gap: 8px; margin-top: 18px; }
</style></head>
<body>
<header>
  <div class="t"><div class="n"><span class="k">Archify</span><span id="name"></span></div><div class="m" id="meta">Loading…</div></div>
  <button id="regen" hidden>Regenerate</button>
  <button id="hstop" hidden>Cancel</button>
  <button id="browser" hidden>Open in browser</button>
  <button id="reveal" hidden>Show in Finder</button>
</header>
<main>
  <div class="card" id="card" hidden><div class="box">
    <h2 id="ch"></h2><p id="cp"></p><div class="step" id="cs" hidden></div><div class="bar" id="cb" hidden><i></i></div>
    <div class="row"><button class="pri" id="go" hidden>Generate</button><button id="stop" hidden>Cancel</button></div>
  </div></div>
</main>
<script>
const q = new URLSearchParams(location.search), sid = q.get('sid'), $ = id => document.getElementById(id);
$('name').textContent = q.get('name') || '';
const ago = t => { const m = Math.round((Date.now() - t) / 60e3); return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : m < 1440 ? Math.round(m / 60) + ' h ago' : Math.round(m / 1440) + ' d ago'; };
const mmss = ms => { const s = Math.floor(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
let st = null, timer = null;
// the diagram is drawn by Mesh in its own view right below this header (main.js archify:show)
const show = file => window.arch.show(file, document.querySelector('header').getBoundingClientRect().bottom);
addEventListener('resize', () => st && show(st.ok && st.html ? st.html : null));
async function load() {
  st = await window.arch.status(sid).catch(e => ({ ok: false, err: e.message }));
  render();
  clearTimeout(timer); if (st && (st.running || st.queued)) timer = setTimeout(load, 2000);   // the other Mac's run has no push: poll while it works
}
function render() {
  const card = (h, p, o = {}) => { $('card').hidden = false; $('ch').textContent = h; $('cp').textContent = p || ''; $('cp').className = o.err ? 'err' : '';
    $('cs').hidden = !o.step; $('cs').textContent = o.step || ''; $('cb').hidden = !o.busy; $('go').hidden = !o.go; $('stop').hidden = !o.busy; };
  if (!st || !st.ok) { $('meta').textContent = ''; show(null); return card("Can't show a diagram", (st && st.err) || 'unknown error', { err: true }); }
  document.title = 'Archify · ' + st.name;
  const where = (st.project || '').replace(/^\/Users\/[^/]+/, '~') + (st.remote ? ' · on ' + st.remote : '');
  const parts = [where];
  if (st.meta && st.meta.at) parts.push('generated ' + ago(st.meta.at));
  $('meta').innerHTML = '';
  $('meta').append(parts.join(' · '));
  if (st.behind > 0) { const s = document.createElement('span'); s.className = 'pill warn'; s.textContent = st.behind + ' commit' + (st.behind > 1 ? 's' : '') + ' behind'; $('meta').append(s); }
  else if (st.behind === 0 && st.html) { const s = document.createElement('span'); s.className = 'pill ok'; s.textContent = 'up to date'; $('meta').append(s); }
  if (st.running) { const s = document.createElement('span'); s.className = 'pill'; s.textContent = 'regenerating ' + mmss(Date.now() - st.running.started); $('meta').append(s); }
  $('regen').hidden = !!(st.running || st.queued) || !st.html; $('hstop').hidden = !(st.html && (st.running || st.queued)); $('browser').hidden = !st.html; $('reveal').hidden = !st.html;
  if (st.html) {
    $('card').hidden = true; show(st.html);
    return;
  }
  show(null);
  if (st.running) return card('Mapping ' + st.name + '…', `Claude is reading the project and drawing it with Archify. This usually takes 5–15 minutes; you can close this window, the diagram is kept. ${mmss(Date.now() - st.running.started)} so far · ${st.running.steps} steps`, { step: st.running.step, busy: true });
  if (st.queued) return card('Waiting for another diagram', 'One Archify run at a time on each Mac; this one starts next.', { busy: true });
  card(st.lastError ? 'The last run did not finish' : 'No diagram yet', st.lastError || 'Generate an interactive map of this project with Archify.', { go: true, err: !!st.lastError });
}
$('go').onclick = async () => { await window.arch.generate(sid); load(); };
$('regen').onclick = async () => { await window.arch.generate(sid); load(); };
$('hstop').onclick = async () => { await window.arch.cancel(sid); setTimeout(load, 800); };
$('stop').onclick = async () => { await window.arch.cancel(sid); setTimeout(load, 800); };
$('browser').onclick = () => st && st.html && window.arch.browser(st.html);
$('reveal').onclick = () => st && st.html && window.arch.reveal(st.html);
window.arch.onChanged(() => load());
setInterval(() => { if (st && st.running) render(); }, 1000);     // the elapsed clock
load();
</script>
</body></html>
