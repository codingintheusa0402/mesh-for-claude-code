    $('tip').hidden = true; return; }
  if (e.target !== c) return;
  const p = world(e), n = pick(p), ed = n ? null : pickEdge(p);
  if (n !== hov || ed !== hovE) { hov = n; hovE = ed; draw(); }
  c.classList.toggle('hot', !!(n || ed));
  const tip = $('tip');
  if (n || ed) { tip.innerHTML = n ? tipOf(n) : `<b>${esc((LINK[ed.type] || LINK.same)[1])}</b><span>${esc(ed.label || '')}</span>`; tip.hidden = false;
    const r = c.getBoundingClientRect(); tip.style.left = Math.min(r.width - 350, e.clientX - r.left + 14) + 'px'; tip.style.top = (e.clientY - r.top + 14) + 'px'; }
  else tip.hidden = true;
});
addEventListener('mouseup', e => {
  const d = drag; drag = null; c.classList.remove('drag');
  if (d && d.n) { d.n.fx = d.n.fy = null; }
  if (down && !down.moved && e.target === c) { const n = pick(world(e)); select(n); }
  down = null;
});
c.addEventListener('dblclick', e => { const n = pick(world(e)); if (n) openOf(n); });
c.addEventListener('wheel', e => { e.preventDefault(); const r = c.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  const k = Math.max(.15, Math.min(5, T.k * Math.exp(-e.deltaY * (e.ctrlKey ? .01 : .0018)))); T.x = mx - (mx - T.x) * k / T.k; T.y = my - (my - T.y) * k / T.k; T.k = k; draw(); }, { passive: false });
c.addEventListener('mouseleave', () => { hov = hovE = null; $('tip').hidden = true; draw(); });

function status(p) { return p.peer ? 'on ' + (data.peer || 'the other Mac') : p.running ? 'building now…' : p.queued ? 'waiting to build' : p.built ? `${nn(p.nodes)} items · ${nn(p.edges)} links · ${p.areas} areas · built ${ago(p.at)}` : 'not built'; }
function tipOf(n) {
  if (n.kind === 'area') return `<b>${esc(n.label)}</b><span>${n.c.size} items · an area of ${esc(n.p.name)}<br>double-click: open ${esc(n.p.name)}'s map</span>`;
  const p = n.p, who = n.kind === 'sess' ? n.s.name : n.ss.map(s => s.name).join(', ');
  return `<b>${esc(n.label)}</b><span>${esc(p.path)}<br>${esc(status(p))}${who ? '<br>sessions: ' + esc(who) : ''}<br>double-click: ${p.built || p.peer ? 'open its map' : 'open (build there)'}</span>`;
}
function select(n) {
  sel = n || null; draw(); paintList();
  const I = $('info'); if (!n) { I.hidden = true; return; }
  const p = n.p, links = edges.filter(e => e.cross && (e.a === (n.hub || n) || e.b === (n.hub || n)));
  I.innerHTML = `<h3>${esc(n.kind === 'area' ? n.label : n.label)}</h3>`
    + (n.kind === 'area' ? `<p>${n.c.size} items · area of ${esc(p.name)}</p>` : `<p>${esc(p.path)}</p><p>${esc(status(p))}</p>`)
    + links.slice(0, 5).map(e => `<p><span style="color:${(LINK[e.type] || LINK.same)[0]}">●</span> ${esc(e.label)}</p>`).join('')
    + `<div class="bt"><button class="pri" data-a="open">${p.built || p.peer ? 'Open map' : 'Open'}</button>${!p.built && !p.peer && !p.running && !p.queued ? '<button data-a="build">Build map</button>' : ''}</div>`;
  I.hidden = false;
  I.querySelector('[data-a="open"]').onclick = () => openOf(n);
  const b = I.querySelector('[data-a="build"]'); if (b) b.onclick = async () => { b.disabled = true; b.textContent = 'Starting…'; const r = await window.cmap.generate(sidOf(n)); if (r && r.ok === false) { b.textContent = r.err || 'Could not build'; } load(); };
}
const sidOf = n => n.kind === 'sess' ? n.s.sid : (n.solo || (n.hub || n).ss[0] || {}).sid;
function openOf(n) { const sid = sidOf(n); if (!sid) return; const s = data.sessions.find(x => x.sid === sid);
  location.href = 'codemap.html?' + new URLSearchParams({ sid, name: (s && s.name) || '', hub: '1', theme: theme.theme, kind: theme.kind }); }

// ---------------- the side list ----------------
function avHtml(s) { return `<span class="av" style="background:${esc(s.color || colOf(s.name))}">${s.avatar ? `<img src="${esc(s.avatar)}" alt="">` : esc(initial(s.name))}</span>`; }
function paintList() {
  if (!data) return; const P = new Map(data.projects.map(p => [p.key, p]));
  const rows = data.sessions.filter(s => !filter || s.name.toLowerCase().includes(filter) || ((P.get(s.key) || {}).name || '').toLowerCase().includes(filter))
    .sort((a, b) => (!!P.get(b.key) - !!P.get(a.key)) || ((P.get(b.key) || {}).built === true) - ((P.get(a.key) || {}).built === true) || a.name.localeCompare(b.name));
  const selSid = sel && sel.kind !== 'area' ? (sel.kind === 'sess' ? [sel.s.sid] : sel.ss.map(s => s.sid)) : [];
  $('list').innerHTML = rows.map(s => { const p = P.get(s.key);
    const sub = !p ? 'no project folder (home)' : (p.name !== s.name ? p.name + ' · ' : '') + (p.peer ? 'on ' + (data.peer || 'the other Mac') : p.running ? 'building…' : p.queued ? 'waiting' : p.built ? `${nn(p.nodes)} items · ${nn(p.edges)} links · built ${ago(p.at)}` : 'not built');
    return `<div class="row${p ? '' : ' nob'}${selSid.includes(s.sid) ? ' on' : ''}" data-sid="${esc(s.sid)}" title="${esc(p ? p.path : '')}">${avHtml(s)}<div class="tx"><div class="nm">${esc(s.name)}</div><div class="sb">${esc(sub)}</div></div></div>`; }).join('');
  $('home').classList.toggle('on', !sel);
}
$('list').addEventListener('click', e => { const r = e.target.closest('.row'); if (!r) return; const s = data.sessions.find(x => x.sid === r.dataset.sid); if (!s || !s.key) return;
  openOf(byId.get('s:' + s.sid) || byId.get('p:' + s.key)); });
$('list').addEventListener('mouseover', e => { const r = e.target.closest('.row'); const s = r && data.sessions.find(x => x.sid === r.dataset.sid); const n = s && (byId.get('s:' + s.sid) || byId.get('p:' + s.key)); if (n !== hov) { hov = n || null; draw(); } });
$('list').addEventListener('mouseleave', () => { hov = null; draw(); });
$('home').onclick = () => { select(null); fit(); };
$('q').addEventListener('input', () => { filter = $('q').value.trim().toLowerCase(); paintList(); draw(); });
$('fit').onclick = fit;
$('reload').onclick = () => load();
addEventListener('keydown', e => { if (e.key === 'Escape') select(null); });

// ---------------- load ----------------
let timer = null;
async function load() {
  const d = await window.cmap.hub().catch(e => ({ ok: false, err: e.message }));
  if (!d || !d.ok) { $('meta').textContent = (d && d.err) || 'Could not read the maps'; return; }
  data = d;
  const built = d.projects.filter(p => p.built).length, nl = d.links.length + (d.slinks || []).length;
  $('meta').textContent = `${d.projects.length} project${d.projects.length === 1 ? '' : 's'} · ${d.sessions.length} session${d.sessions.length === 1 ? '' : 's'} · ${built} mapped · ${nl} connection${nl === 1 ? '' : 's'} between them`;
  const used = new Set([...d.links, ...(d.slinks || [])].map(l => l.type)); if (d.projects.some(p => p.sessions.length > 1)) used.add('same');
  $('legend').innerHTML = [...used].map(t => `<span><i style="border-color:${LINK[t][0]};${t === 'names' ? 'border-top-style:dashed' : t === 'lineage' ? 'border-top-style:dotted' : ''}"></i>${LINK[t][1]}</span>`).join('')
    + '<span>· grey dashed hub = no map yet · dots = code areas (size = items)</span>';
  $('empty').hidden = !!d.projects.length; $('empty').textContent = d.projects.length ? '' : 'No session works in a project folder yet.';
  graphOf(d);
  if (sel) { const s2 = byId.get(sel.id); select(s2 || null); } else paintList();
  clearTimeout(timer); if (d.projects.some(p => p.running || p.queued)) timer = setTimeout(load, 2000);
}
window.cmap.show(null, document.querySelector('header').getBoundingClientRect().bottom);   // back from a project's map: hide its graph
window.cmap.onChanged(() => load());
window.cmap.onTheme(t => applyTheme(t));
window.cmap.theme().then(applyTheme).catch(() => { });
applyTheme(theme); size(); load();
</script>
</body></html>
