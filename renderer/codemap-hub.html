  for (const e of DD.cross) { const ax = C[3 * e.a], ay = C[3 * e.a + 1], bx = C[3 * e.b], by = C[3 * e.b + 1], cx = (ax + bx) / 2 - (by - ay) * e.bend, cy = (ay + by) / 2 + (bx - ax) * e.bend;
    for (let t = .2; t <= .8; t += .04) { const u = 1 - t, x = u * u * ax + 2 * u * t * cx + t * t * bx, y = u * u * ay + 2 * u * t * cy + t * t * by, d = Math.hypot(x - p.x, y - p.y); if (d < bd) { bd = d; best = e; } } }
  return best;
}
function setMode(m) {
  if (m === mode) return; if (mode === 'detail') Td = T; else Ts = T;
  mode = m; try { localStorage.setItem('cmHubMode', m); } catch { }
  paintMode(); $('info').hidden = true; $('tip').hidden = true; sel = null; dSel = -1;
  if (m === 'detail') { if (data && data.detail && DD) { if (Td) T = Td; draw(); metaDetail(); legend(); } else load(); }
  else { if (Ts) T = Ts; else fit(); if (data) metaSimple(data); legend(); draw(); kick(); }
}
function paintMode() { for (const b of $('mode').querySelectorAll('button')) b.classList.toggle('on', b.dataset.m === mode); }
$('mode').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setMode(b.dataset.m); });
paintMode();

// ---------------- pointer ----------------
let drag = null, hovE = null, down = null;
const world = e => { const r = c.getBoundingClientRect(); return { x: (e.clientX - r.left - T.x) / T.k, y: (e.clientY - r.top - T.y) / T.k }; };
function pick(p) { let best = null, bd = 1e9; for (const n of nodes) { const d = Math.hypot(n.x - p.x, n.y - p.y); if (d <= n.r + 3 / T.k && d < bd) { best = n; bd = d; } } return best; }
function pickEdge(p) {
  let best = null, bd = 7 / T.k;
  for (const e of edges) { if (!e.cross && e.type !== 'same') continue;
    const mx = (e.a.x + e.b.x) / 2, my = (e.a.y + e.b.y) / 2, dx = e.b.x - e.a.x, dy = e.b.y - e.a.y, cx = e.cross ? mx - dy * e.bend : mx, cy = e.cross ? my + dx * e.bend : my;
    for (let t = 0; t <= 1; t += .05) { const u = 1 - t, x = u * u * e.a.x + 2 * u * t * cx + t * t * e.b.x, y = u * u * e.a.y + 2 * u * t * cy + t * t * e.b.y, d = Math.hypot(x - p.x, y - p.y); if (d < bd) { bd = d; best = e; } } }
  return best;
}
c.addEventListener('mousedown', e => { const p = world(e), n = mode === 'detail' ? null : pick(p); down = { x: e.clientX, y: e.clientY, moved: false };
  drag = n ? { n, dx: n.x - p.x, dy: n.y - p.y } : { pan: true, x: e.clientX - T.x, y: e.clientY - T.y }; c.classList.add('drag'); });
addEventListener('mousemove', e => {
  if (drag) { if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 3) down.moved = true;
    if (drag.pan) { T.x = e.clientX - drag.x; T.y = e.clientY - drag.y; if (mode === 'detail') { dMoved = true; drawSoon(); } else draw(); }
    else if (down.moved) { const p = world(e); drag.n.fx = p.x + drag.dx; drag.n.fy = p.y + drag.dy; alpha = Math.max(alpha, .25); kick(); }
    $('tip').hidden = true; return; }
  if (e.target !== c) return;
  if (mode === 'detail') return hoverDetail(e);
  const p = world(e), n = pick(p), ed = n ? null : pickEdge(p);
  if (n !== hov || ed !== hovE) { hov = n; hovE = ed; draw(); }
  c.classList.toggle('hot', !!(n || ed));
  const tip = $('tip');
  if (n || ed) { tip.innerHTML = n ? tipOf(n) : `<b>${esc((LINK[ed.type] || LINK.same)[1])}</b><span>${esc(ed.label || '')}</span>`; tip.hidden = false;
    const r = c.getBoundingClientRect(); tip.style.left = Math.min(r.width - 350, e.clientX - r.left + 14) + 'px'; tip.style.top = (e.clientY - r.top + 14) + 'px'; }
  else tip.hidden = true;
});
addEventListener('mouseup', e => {
  const d = drag; drag = null; c.classList.remove('drag');
  if (d && d.n) { d.n.fx = d.n.fy = null; }
  if (down && !down.moved && e.target === c) { if (mode === 'detail') selectDetail(pickDetail(world(e))); else select(pick(world(e))); }
  down = null;
});
c.addEventListener('dblclick', e => { if (mode === 'detail') { const p = world(e), i = pickDetail(p), ci = i >= 0 ? DD.proj[i] : clusterAt(p); if (ci >= 0) openProject(DD.list[ci]); return; }
  const n = pick(world(e)); if (n) openOf(n); });
c.addEventListener('wheel', e => { e.preventDefault(); const r = c.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  const k = Math.max(.15, Math.min(5, T.k * Math.exp(-e.deltaY * (e.ctrlKey ? .01 : .0018)))); T.x = mx - (mx - T.x) * k / T.k; T.y = my - (my - T.y) * k / T.k; T.k = k; if (mode === 'detail') { dMoved = true; drawSoon(); } else draw(); }, { passive: false });
c.addEventListener('mouseleave', () => { hov = hovE = null; dHov = -1; dHovE = null; $('tip').hidden = true; draw(); });
// Detail: at most one redraw per frame while panning or zooming
let drawRaf = 0; function drawSoon() { if (!drawRaf) drawRaf = requestAnimationFrame(() => { drawRaf = 0; draw(); }); }
function hoverDetail(e) {
  const p = world(e), i = pickDetail(p), ed = i >= 0 ? null : pickCross(p);
  if (i !== dHov || ed !== dHovE) { dHov = i; dHovE = ed; drawSoon(); }
  c.classList.toggle('hot', i >= 0 || !!ed); const tip = $('tip');
  if (i >= 0 || ed) { tip.innerHTML = i >= 0 ? tipDetail(i) : `<b>${esc((LINK[ed.type] || LINK.same)[1])}</b><span>${esc(ed.label || '')}</span>`; tip.hidden = false;
    const r = c.getBoundingClientRect(); tip.style.left = Math.min(r.width - 350, e.clientX - r.left + 14) + 'px'; tip.style.top = Math.min(r.height - 120, e.clientY - r.top + 14) + 'px'; }
  else tip.hidden = true;
}

function status(p) { return p.peer && !p.built ? 'on ' + (data.peer || 'the other Mac') : p.peer ? `${nn(p.nodes)} items · ${nn(p.edges)} links · on ${data.peer || 'the other Mac'}` : p.running ? 'building now…' : p.queued ? 'waiting to build' : p.built ? `${nn(p.nodes)} items · ${nn(p.edges)} links · ${p.areas} areas · built ${ago(p.at)}` : 'not built'; }
function tipOf(n) {
  if (n.kind === 'area') return `<b>${esc(n.label)}</b><span>${n.c.size} items · an area of ${esc(n.p.name)}<br>double-click: open ${esc(n.p.name)}'s map</span>`;
  const p = n.p, who = n.kind === 'sess' ? n.s.name : n.ss.map(s => s.name).join(', ');
  return `<b>${esc(n.label)}</b><span>${esc(p.path)}<br>${esc(status(p))}${who ? '<br>sessions: ' + esc(who) : ''}<br>double-click: ${p.built || p.peer ? 'open its map' : 'open (build there)'}</span>`;
}
function select(n) {
  sel = n || null; draw(); paintList();
  const I = $('info'); if (!n) { I.hidden = true; return; }
  const p = n.p, links = edges.filter(e => e.cross && (e.a === (n.hub || n) || e.b === (n.hub || n)));
  I.innerHTML = `<h3>${esc(n.kind === 'area' ? n.label : n.label)}</h3>`
    + (n.kind === 'area' ? `<p>${n.c.size} items · area of ${esc(p.name)}</p>` : `<p>${esc(p.path)}</p><p>${esc(status(p))}</p>`)
    + links.slice(0, 5).map(e => `<p><span style="color:${(LINK[e.type] || LINK.same)[0]}">●</span> ${esc(e.label)}</p>`).join('')
    + `<div class="bt"><button class="pri" data-a="open">${p.built || p.peer ? 'Open map' : 'Open'}</button>${!p.built && !p.peer && !p.running && !p.queued ? '<button data-a="build">Build map</button>' : ''}</div>`;
  I.hidden = false;
  I.querySelector('[data-a="open"]').onclick = () => openOf(n);
  const b = I.querySelector('[data-a="build"]'); if (b) b.onclick = async () => { b.disabled = true; b.textContent = 'Starting…'; const r = await window.cmap.generate(sidOf(n)); if (r && r.ok === false) { b.textContent = r.err || 'Could not build'; } load(); };
}
const sidOf = n => n.kind === 'sess' ? n.s.sid : (n.solo || (n.hub || n).ss[0] || {}).sid;
function openOf(n) { const sid = sidOf(n); if (!sid) return; const s = data.sessions.find(x => x.sid === sid);
  location.href = 'codemap.html?' + new URLSearchParams({ sid, name: (s && s.name) || '', hub: '1', theme: theme.theme, kind: theme.kind }); }

// ---------------- the side list ----------------
function avHtml(s) { return `<span class="av" style="background:${esc(s.color || colOf(s.name))}">${s.avatar ? `<img src="${esc(s.avatar)}" alt="">` : esc(initial(s.name))}</span>`; }
function paintList() {
  if (!data) return; const P = new Map(data.projects.map(p => [p.key, p]));
  const rows = data.sessions.filter(s => !filter || s.name.toLowerCase().includes(filter) || ((P.get(s.key) || {}).name || '').toLowerCase().includes(filter))
    .sort((a, b) => (!!P.get(b.key) - !!P.get(a.key)) || ((P.get(b.key) || {}).built === true) - ((P.get(a.key) || {}).built === true) || a.name.localeCompare(b.name));
  const selSid = sel && sel.kind !== 'area' ? (sel.kind === 'sess' ? [sel.s.sid] : sel.ss.map(s => s.sid)) : [];
  $('list').innerHTML = rows.map(s => { const p = P.get(s.key);
    const sub = !p ? 'no project folder (home)' : (p.name !== s.name ? p.name + ' · ' : '') + (p.peer ? 'on ' + (data.peer || 'the other Mac') : p.running ? 'building…' : p.queued ? 'waiting' : p.built ? `${nn(p.nodes)} items · ${nn(p.edges)} links · built ${ago(p.at)}` : 'not built');
    return `<div class="row${p ? '' : ' nob'}${selSid.includes(s.sid) ? ' on' : ''}" data-sid="${esc(s.sid)}" title="${esc(p ? p.path : '')}">${avHtml(s)}<div class="tx"><div class="nm">${esc(s.name)}</div><div class="sb">${esc(sub)}</div></div></div>`; }).join('');
  $('home').classList.toggle('on', !sel);
}
$('list').addEventListener('click', e => { const r = e.target.closest('.row'); if (!r) return; const s = data.sessions.find(x => x.sid === r.dataset.sid); if (!s || !s.key) return;
  openOf(byId.get('s:' + s.sid) || byId.get('p:' + s.key)); });
$('list').addEventListener('mouseover', e => { const r = e.target.closest('.row'); const s = r && data.sessions.find(x => x.sid === r.dataset.sid); const n = s && (byId.get('s:' + s.sid) || byId.get('p:' + s.key)); if (n !== hov) { hov = n || null; draw(); } });
$('list').addEventListener('mouseleave', () => { hov = null; draw(); });
$('home').onclick = () => { if (mode === 'detail') { selectDetail(-1); dMoved = false; fitDetail(); draw(); } else { select(null); fit(); } };
$('q').addEventListener('input', () => { filter = $('q').value.trim().toLowerCase(); matchDetail(); paintList(); draw(); });
$('fit').onclick = () => { if (mode === 'detail') { dMoved = false; fitDetail(); draw(); } else fit(); };
$('reload').onclick = () => load();
addEventListener('keydown', e => { if (e.key === 'Escape') { if (mode === 'detail') selectDetail(-1); else select(null); } });

// ---------------- load ----------------
let timer = null;
// what the maps are now: a Detail picture is laid out again only when one of them changed
const sigOf = d => d.projects.map(p => p.key + ':' + p.built + ':' + (p.at || 0)).join('|');
function metaSimple(d) {
  const built = d.projects.filter(p => p.built).length, nl = d.links.length + (d.slinks || []).length;
  $('meta').textContent = `${d.projects.length} project${d.projects.length === 1 ? '' : 's'} · ${d.sessions.length} session${d.sessions.length === 1 ? '' : 's'} · ${built} mapped · ${nl} connection${nl === 1 ? '' : 's'} between them`;
}
function legend() {
  if (!data) return; const d = data, used = new Set([...d.links, ...(d.slinks || [])].map(l => l.type)); if (mode === 'simple' && d.projects.some(p => p.sessions.length > 1)) used.add('same');
  $('legend').innerHTML = [...used].map(t => `<span><i style="border-color:${LINK[t][0]};${t === 'names' ? 'border-top-style:dashed' : t === 'lineage' ? 'border-top-style:dotted' : ''}"></i>${LINK[t][1]}</span>`).join('')
    + (mode === 'detail' ? '<span>· dots = items, coloured by area · click one for its neighbours · double-click a cluster to open its map</span>' : '<span>· grey dashed hub = no map yet · dots = code areas (size = items)</span>');
}
async function load(poll) {
  const want = mode === 'detail' && !poll;
  if (want) { perf.t0 = performance.now(); perf.first = perf.done = 0; $('meta').textContent = 'Reading every map…'; }
  const d = await (want ? window.cmap.hubDetail() : window.cmap.hub()).catch(e => ({ ok: false, err: e.message }));
  if (!d || !d.ok) { $('meta').textContent = (d && d.err) || 'Could not read the maps'; return; }
  // a status poll while in Detail keeps the picture unless a map changed
  if (poll && mode === 'detail' && data && data.detail) { if (sigOf(d) !== sigOf(data)) return load();
    const now = new Map(d.projects.map(p => [p.key, p])); for (const p of data.projects) { const q = now.get(p.key); if (q) { p.running = q.running; p.queued = q.queued; } } }
  else data = d;
  if (mode === 'simple') metaSimple(d); legend();
  $('empty').hidden = !!d.projects.length; $('empty').textContent = d.projects.length ? '' : 'No session works in a project folder yet.';
  if (!(poll && mode === 'detail')) graphOf(d);
  if (want) startDetail(d);
  if (mode === 'simple' && sel) { const s2 = byId.get(sel.id); select(s2 || null); } else paintList();
  clearTimeout(timer); if (d.projects.some(p => p.running || p.queued)) timer = setTimeout(() => load(true), 2000);
}
window.cmap.show(null, document.querySelector('header').getBoundingClientRect().bottom);   // back from a project's map: hide its graph
window.cmap.onChanged(() => load(mode === 'detail'));
window.cmap.onTheme(t => applyTheme(t));
window.cmap.theme().then(applyTheme).catch(() => { });
applyTheme(theme); size(); load();
</script>
</body></html>
