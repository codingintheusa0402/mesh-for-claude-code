name: ClaudeMesh
options:
  bundleIdPrefix: dev.meshforclaudecode
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    # name, bundle id and signing team: Mesh.xcconfig (+ your gitignored Local.xcconfig)
targets:
  ClaudeMesh:
    type: application
    configFiles:
      Debug: Mesh.xcconfig
      Release: Mesh.xcconfig
    platform: iOS
    sources: [ClaudeMesh]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MESH_BUNDLE_ID)
        PRODUCT_NAME: $(MESH_NAME)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: $(MESH_NAME)
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_NSCameraUsageDescription: Scan the pairing QR code shown in $(MESH_NAME) on your Mac, and take photos to attach to a session.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Record a video to attach to a session.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Attach photos and videos to a session.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connect to $(MESH_NAME) running on your Mac.
    info:
      path: ClaudeMesh/Info.plist
      properties:
        CADisableMinimumFrameDurationOnPhone: true   # let ProMotion iPhones run above 60 Hz
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true      # the Mac serves plain http on your Wi-Fi / Tailnet (100.x). Don't add
                                            # NSAllowsLocalNetworking: its presence makes iOS ignore this key → Tailscale blocked
