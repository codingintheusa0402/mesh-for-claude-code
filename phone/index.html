<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mesh for Claude Code">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" id="manifest">
<title>Mesh for Claude Code</title>
<link rel="stylesheet" href="/xterm.css">
<link rel="stylesheet" href="/phone.css">
<link rel="stylesheet" href="/live-view.css">
<link rel="stylesheet" href="/usage-view.css">
</head>
<body data-view="split">
<div id="app">
<header id="top">
  <button id="navBtn" aria-label="Sessions"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <img src="/icon.png" class="logo" alt="">
  <span class="brand">Mesh for Claude Code</span>
  <div id="titlePill"><b id="tpName">Mesh</b><small id="tpSub"></small></div>
  <span id="hostTag" class="hosttag hidden"></span>
  <span class="spacer"></span>
  <span id="conn" class="conn" title="connection"></span>
  <span id="vnc" class="vnc hidden"></span>
  <span id="disp" class="vnc hidden"></span>
  <span id="topSw" class="vnc hidden"></span>
  <span id="today" class="today"></span>
</header>

<main id="stage">
  <canvas id="mesh"></canvas>
  <div id="hint">Tap a session · pinch to zoom · drag the sun to spin · tap it for its menu</div>
</main>

<section id="split" aria-label="Session"><div id="switch"></div><div id="pane"></div></section>
<section id="grid" aria-label="All live sessions"></section>

<section id="sheet" class="sheet hidden"><div class="grab"></div><div id="sheetBody"></div></section>
<div id="scrim"></div>
</div>
<aside id="drawer" aria-label="Sessions"></aside>

<nav id="tabs">
  <button data-tab="split" class="on"><b>◧</b>Sessions</button>
  <button data-tab="grid"><b>▦</b>Grid</button>
  <button data-tab="history"><b>↺</b>All sessions</button>
  <button data-tab="term" id="termTab" class="hidden"><b>›_</b>Terminal</button>
</nav>
<div id="kbBar"><button id="kbDone">Done</button></div>
<div id="toast"></div>
<div id="offline" class="hidden"></div>

<script src="/app-name.js"></script>
<script src="/xterm.js"></script>
<script src="/phone-viz.js"></script>
<script src="/md.js"></script>
<script src="/term-stamps.js"></script>
<script src="/usage-view.js"></script>
<script src="/avatars.js"></script>
<script src="/live-view.js"></script>
<script src="/phone.js"></script>
</body>
</html>
